name: Check official education data

on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-official-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official source pages
        id: check
        run: npm run data:check

      - name: Summarize data changes
        run: npm run data:summarize
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: official-data-check
          path: reports/official-data-check.json

      - name: Open issue when a potential update is detected
        if: steps.check.outputs.has_potential_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Review potential official education data update";
            const body = [
              "${{ steps.check.outputs.summary }}",
              "",
              "Review the uploaded `official-data-check` artifact. If the changed links are relevant, run `npm run data:update`, `npm run test`, and `npm run build` before publishing new data.",
              "",
              "The workflow does not auto-publish new data."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["data-update"]
            });
